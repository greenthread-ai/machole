name: App Store

# Builds the sandboxed, App-Store-signed installer (.pkg) with the `mas`
# Electron variant and uploads it to App Store Connect.
#
# Run it manually: Actions -> App Store -> Run workflow. App Store submissions
# are deliberate, so this is never triggered automatically.
#
# Required repository secrets:
#   MACOS_MAS_CERT_P12_BASE64   base64 of a .p12 containing BOTH the app
#                               signing cert ("Apple Distribution" or "3rd
#                               Party Mac Developer Application") and the
#                               installer cert ("3rd Party Mac Developer
#                               Installer").
#   MACOS_MAS_CERT_PASSWORD     password for that .p12
#   APPLE_MAS_IDENTITY          app cert common name, e.g.
#                               "Apple Distribution: Acme (TEAMID)"
#   APPLE_MAS_INSTALLER_IDENTITY installer cert common name, e.g.
#                               "3rd Party Mac Developer Installer: Acme (TEAMID)"
#   APPLE_TEAM_ID               10-character Apple Developer Team ID
#   APPLE_PROVISIONING_PROFILE_BASE64  base64 of the Mac App Store provisioning
#                               profile for bundle id ai.greenthread.machole
#   APPLE_API_KEY_P8            base64 of the App Store Connect API key (.p8)
#   APPLE_API_KEY_ID            the API key id
#   APPLE_API_ISSUER_ID         the API key issuer id

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.0)'
        required: true
      submit:
        description: 'Upload to App Store Connect after building'
        type: boolean
        default: true

jobs:
  build-appstore:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Check signing secrets
        env:
          MACOS_MAS_CERT_P12_BASE64: ${{ secrets.MACOS_MAS_CERT_P12_BASE64 }}
          APPLE_MAS_IDENTITY: ${{ secrets.APPLE_MAS_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_MAS_CERT_P12_BASE64" ] || [ -z "$APPLE_MAS_IDENTITY" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::App Store signing secrets are not configured. See the comment at the top of this workflow."
            exit 1
          fi

      - name: Substitute Team ID into MAS entitlements
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/TEAMID/$APPLE_TEAM_ID/g" build/entitlements.mas.plist
          echo "Entitlements:" && cat build/entitlements.mas.plist

      - name: Import signing certificates
        env:
          MACOS_MAS_CERT_P12_BASE64: ${{ secrets.MACOS_MAS_CERT_P12_BASE64 }}
          MACOS_MAS_CERT_PASSWORD: ${{ secrets.MACOS_MAS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_MAS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mas-cert.p12"
          security import "$RUNNER_TEMP/mas-cert.p12" -P "$MACOS_MAS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/mas-cert.p12"

      - name: Write provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/machole.provisionprofile"

      - name: Build App Store installer (.pkg)
        env:
          APPLE_MAS_IDENTITY: ${{ secrets.APPLE_MAS_IDENTITY }}
          APPLE_MAS_INSTALLER_IDENTITY: ${{ secrets.APPLE_MAS_INSTALLER_IDENTITY }}
          APPLE_PROVISIONING_PROFILE: ${{ runner.temp }}/machole.provisionprofile
        run: npm run make -- --platform=mas --arch=universal

      - name: Locate the .pkg
        id: pkg
        run: |
          PKG="$(find out/make -name '*.pkg' -print -quit)"
          if [ -z "$PKG" ]; then
            echo "::error::No .pkg produced by electron-forge make"
            exit 1
          fi
          echo "path=$PKG" >> "$GITHUB_OUTPUT"
          echo "Built $PKG"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: machole-appstore-pkg
          path: ${{ steps.pkg.outputs.path }}

      - name: Upload to App Store Connect
        if: ${{ inputs.submit }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_API_KEY_P8 is not set — cannot upload."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APPLE_API_KEY_P8" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --upload-app --type macos \
            --file "${{ steps.pkg.outputs.path }}" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/machole.provisionprofile"
          rm -rf "$HOME/.appstoreconnect/private_keys"
