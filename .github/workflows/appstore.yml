name: App Store

# Builds the sandboxed, App-Store-signed installer (.pkg) with the `mas`
# Electron variant and uploads it to App Store Connect.
#
# Runs automatically when a GitHub Release is published, and can also be run
# manually (Actions -> App Store -> Run workflow).
#
# Uploading only *stages* a build in App Store Connect — you still attach it
# to a version and submit for review there. The CI run number is used as the
# CFBundleVersion, so repeated builds never collide.
#
# If the App Store signing secrets are not configured, a release-triggered run
# skips with a warning (so it never fails an ordinary release); a manual run
# fails so the misconfiguration is obvious.
#
# Required repository secrets (see docs/APP_STORE.md):
#   MACOS_MAS_APP_CERT_P12_BASE64        base64 of the "Apple Distribution"
#                                        cert .p12
#   MACOS_MAS_APP_CERT_PASSWORD          password for that .p12
#   MACOS_MAS_INSTALLER_CERT_P12_BASE64  base64 of the "3rd Party Mac
#                                        Developer Installer" cert .p12
#   MACOS_MAS_INSTALLER_CERT_PASSWORD    password for that .p12
#   APPLE_MAS_IDENTITY           app cert common name
#   APPLE_MAS_INSTALLER_IDENTITY installer cert common name
#   APPLE_TEAM_ID                10-character Apple Developer Team ID
#   APPLE_PROVISIONING_PROFILE_BASE64  base64 of the Mac App Store profile
#   APPLE_API_KEY_P8             base64 of the App Store Connect API key (.p8)
#   APPLE_API_KEY_ID             the API key id
#   APPLE_API_ISSUER_ID          the API key issuer id

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.0)'
        required: true
      submit:
        description: 'Upload to App Store Connect after building'
        type: boolean
        default: true

jobs:
  build-appstore:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "submit=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "submit=${{ inputs.submit }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        id: check
        env:
          MACOS_MAS_APP_CERT_P12_BASE64: ${{ secrets.MACOS_MAS_APP_CERT_P12_BASE64 }}
          APPLE_MAS_IDENTITY: ${{ secrets.APPLE_MAS_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_MAS_APP_CERT_P12_BASE64" ] && [ -n "$APPLE_MAS_IDENTITY" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "::warning::App Store signing secrets are not configured — skipping the App Store build."
            else
              echo "::error::App Store signing secrets are not configured. See docs/APP_STORE.md."
              exit 1
            fi
          fi

      - name: Set up Node
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Set version
        if: steps.check.outputs.configured == 'true'
        run: npm version "${{ steps.params.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Substitute Team ID into MAS entitlements
        if: steps.check.outputs.configured == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/TEAMID/$APPLE_TEAM_ID/g" build/entitlements.mas.plist
          echo "Entitlements:" && cat build/entitlements.mas.plist

      - name: Import signing certificates
        if: steps.check.outputs.configured == 'true'
        env:
          MACOS_MAS_APP_CERT_P12_BASE64: ${{ secrets.MACOS_MAS_APP_CERT_P12_BASE64 }}
          MACOS_MAS_APP_CERT_PASSWORD: ${{ secrets.MACOS_MAS_APP_CERT_PASSWORD }}
          MACOS_MAS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_MAS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_MAS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_MAS_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Import the app-signing and installer certificates (separate .p12s).
          import_p12() {
            echo "$1" | base64 --decode > "$RUNNER_TEMP/import.p12"
            security import "$RUNNER_TEMP/import.p12" -P "$2" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm "$RUNNER_TEMP/import.p12"
          }
          import_p12 "$MACOS_MAS_APP_CERT_P12_BASE64" "$MACOS_MAS_APP_CERT_PASSWORD"
          import_p12 "$MACOS_MAS_INSTALLER_CERT_P12_BASE64" "$MACOS_MAS_INSTALLER_CERT_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Write provisioning profile
        if: steps.check.outputs.configured == 'true'
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/machole.provisionprofile"

      - name: Build App Store installer (.pkg)
        if: steps.check.outputs.configured == 'true'
        env:
          APPLE_MAS_IDENTITY: ${{ secrets.APPLE_MAS_IDENTITY }}
          APPLE_MAS_INSTALLER_IDENTITY: ${{ secrets.APPLE_MAS_INSTALLER_IDENTITY }}
          APPLE_PROVISIONING_PROFILE: ${{ runner.temp }}/machole.provisionprofile
          # Unique, increasing CFBundleVersion so App Store Connect never sees
          # a duplicate build number.
          MACHOLE_BUILD_VERSION: ${{ github.run_number }}
        run: npm run make -- --platform=mas --arch=universal

      - name: Locate the .pkg
        id: pkg
        if: steps.check.outputs.configured == 'true'
        run: |
          PKG="$(find out/make -name '*.pkg' -print -quit)"
          if [ -z "$PKG" ]; then
            echo "::error::No .pkg produced by electron-forge make"
            exit 1
          fi
          echo "path=$PKG" >> "$GITHUB_OUTPUT"
          echo "Built $PKG"

      - name: Upload .pkg artifact
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: machole-appstore-pkg
          path: ${{ steps.pkg.outputs.path }}

      - name: Upload to App Store Connect
        if: steps.check.outputs.configured == 'true' && steps.params.outputs.submit == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_API_KEY_P8 is not set — cannot upload."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APPLE_API_KEY_P8" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --upload-app --type macos \
            --file "${{ steps.pkg.outputs.path }}" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/machole.provisionprofile"
          rm -rf "$HOME/.appstoreconnect/private_keys"
