name: Release

# Fires when you publish a GitHub Release (Releases tab -> Draft a new release
# -> tag e.g. v1.2.0 -> Publish). The job builds a universal, signed and
# notarized macOS app and attaches the .dmg to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Import Developer ID signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "::warning::No signing certificate configured - building UNSIGNED."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Keep the login keychain in the search list so the runner stays usable.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Write App Store Connect API key (for notarization)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          fi

      - name: Build, sign & notarize universal .dmg
        env:
          # When these are unset the build still runs, just unsigned (see forge.config.ts).
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: npm run make -- --arch=universal

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/api-key.p8"

      - name: Attach .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="$(find out/make -name '*.dmg' -print -quit)"
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg produced by electron-forge make"
            exit 1
          fi
          echo "Uploading $DMG"
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
